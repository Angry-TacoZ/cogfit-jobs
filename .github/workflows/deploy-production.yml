name: Deploy production

on:
  workflow_run:
    workflows:
      - Verify
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Verify and deploy current main
    if: >-
      vars.PRODUCTION_DEPLOY_ENABLED == 'true' &&
      ((github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment:
      name: production
      url: https://cogfit-jobs.web.app
    env:
      CI: true
      DEPLOY_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      FIREBASE_PROJECT_ID: cogfit-jobs
      LIVE_SITE_URL: https://cogfit-jobs.web.app

    steps:
      - name: Check out verified commit
        uses: actions/checkout@v5
        with:
          ref: ${{ env.DEPLOY_SHA }}
          fetch-depth: 0

      - name: Require the current main commit
        shell: bash
        run: |
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$DEPLOY_SHA"
          test "$(git rev-parse origin/main)" = "$DEPLOY_SHA"

      - name: Require deployment identity configuration
        shell: bash
        env:
          WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          DEPLOY_SERVICE_ACCOUNT: ${{ vars.GCP_SERVICE_ACCOUNT }}
        run: |
          test -n "$WORKLOAD_IDENTITY_PROVIDER" || {
            echo "::error::Set the GCP_WORKLOAD_IDENTITY_PROVIDER variable."
            exit 1
          }
          test -n "$DEPLOY_SERVICE_ACCOUNT" || {
            echo "::error::Set the GCP_SERVICE_ACCOUNT variable."
            exit 1
          }

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json

      - name: Install application dependencies
        run: npm ci

      - name: Install function dependencies
        run: npm ci --prefix functions

      - name: Lint
        run: npm run lint

      - name: Run unit tests
        run: npm run test

      - name: Build production application
        run: npm run build

      - name: Scan browser-delivered code for exposed secrets
        run: npm run scan:secrets

      - name: Audit application dependencies
        run: npm audit --audit-level=high

      - name: Audit function dependencies
        run: npm audit --prefix functions --audit-level=high

      - name: Reconfirm the current main commit
        shell: bash
        run: |
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$DEPLOY_SHA"
          test "$(git rev-parse origin/main)" = "$DEPLOY_SHA"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.FIREBASE_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          create_credentials_file: true

      - name: Deploy Hosting and Functions
        run: >-
          npx --yes firebase-tools@15.8.0 deploy
          --only hosting,functions
          --project "$FIREBASE_PROJECT_ID"
          --non-interactive

      - name: Verify the live release
        run: npm run smoke:live
