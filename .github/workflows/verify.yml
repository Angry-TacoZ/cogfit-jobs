name: Verify

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: '17 8 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, test, build, smoke, and scan
    # The locked Playwright version does not support Chromium on Ubuntu 26.04.
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    env:
      CI: true

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up the Functions runtime
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install function dependencies
        run: npm ci --prefix functions

      - name: Set up Node.js for the Firebase web SDK
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Set up Java for Firestore emulator
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Install application dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Run unit tests
        run: npm run test

      - name: Reject a build without an App Check site key
        run: |
          if npm run build > build-without-site-key.log 2>&1; then
            echo "Build unexpectedly succeeded without an App Check site key."
            exit 1
          fi
          if ! grep -F 'VITE_FIREBASE_APPCHECK_SITE_KEY is required to build CogFit Jobs.' build-without-site-key.log; then
            cat build-without-site-key.log
            exit 1
          fi

      - name: Build application for the local browser smoke test
        env:
          VITE_FIREBASE_APPCHECK_SITE_KEY: ci-smoke-test-placeholder
        run: npm run build

      - name: Scan browser-delivered code for exposed secrets
        run: npm run scan:secrets

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run browser smoke test
        run: npm run smoke

      - name: Restore the Functions runtime for the Firestore smoke test
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Run Firestore REST smoke test
        run: npm run smoke:firestore

      - name: Audit function dependencies
        run: npm audit --prefix functions --audit-level=high

      - name: Audit root dependencies with audit-ci
        # See docs/dependency-audit-exceptions.md; high and critical findings are not allowlisted.
        run: npm run audit:ci
