version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '08:00'
      timezone: Etc/UTC
    open-pull-requests-limit: 3
    groups:
      routine-patch-minor:
        applies-to: version-updates
        patterns:
          - '*'
        update-types:
          - minor
          - patch
      security-patch-minor:
        applies-to: security-updates
        patterns:
          - '*'
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /functions
    schedule:
      interval: weekly
      day: monday
      time: '08:00'
      timezone: Etc/UTC
    open-pull-requests-limit: 2
    groups:
      routine-patch-minor:
        applies-to: version-updates
        patterns:
          - '*'
        update-types:
          - minor
          - patch
      security-patch-minor:
        applies-to: security-updates
        patterns:
          - '*'
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '08:00'
      timezone: Etc/UTC
    open-pull-requests-limit: 2
    groups:
      routine-patch-minor:
        applies-to: version-updates
        patterns:
          - '*'
        update-types:
          - minor
          - patch
      security-patch-minor:
        applies-to: security-updates
        patterns:
          - '*'
        update-types:
          - minor
          - patch
